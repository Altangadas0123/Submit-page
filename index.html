<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="pic"></div>
        <form>
            <div class="h1-h2">
                <div class="h1">Get Umrah Quote</div>
                <div class="h2">All-Inclusive Umrah Package</div>
            </div>
            <div class="input-container">
                <div class="input-box">
                    <div class="text">Lead Passenger Name</div>
                    <input class="placeholder-bg" type="text" placeholder="Mohammad Ali">
                </div>
                <div class="input-box">
                    <div class="text">Enter Active Number:</div>
                    <input class="placeholder-bg" type="text" placeholder="+$$ 203 123 4567">
                </div>
                <div class="input-box">
                    <div class="text">Enter Email:</div>
                    <input class="placeholder-bg" type="text" placeholder="myemail@gmail.com">
                </div>
                <div class="input-box">
                    <div class="text">Total Passengers:</div>
                    <input class="placeholder-bg" type="text" placeholder="i.e 2 adult & 2 kid">
                </div>
            </div>
            <div class="checkbox-container">
                <div class="checkbox-text">I accept the <span> Privacy Policy</span></div>
                <input class="checkbox" type="checkbox">
            </div>
            <button>Submit</button>
        </form>
    </div>
</body>
</html>
